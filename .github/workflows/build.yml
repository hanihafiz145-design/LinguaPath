name: Build LinguaPath APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project ZIP
        run: |
          curl -L "https://raw.githubusercontent.com/${{ github.repository }}/main/LinguaPath-Android-full.zip" -o project.zip

      - name: Extract project
        run: |
          unzip -q project.zip
          echo "Project extracted successfully"
          ls -la LinguaPath

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: LinguaPath
        run: |
          cat > /tmp/fix-jvm.gradle <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

          gradle -I /tmp/fix-jvm.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaPath-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
